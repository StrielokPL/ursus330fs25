name: One-shot source cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply cleanup
        run: python3 tools/maintenance_cleanup.py

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add c330m.i3d c330m.xml modDesc.xml docs/FS25_C330_TECHNICAL_BASELINE.md
          git commit -m 'Clean imported C-330 source before diagnostics'
          git push
