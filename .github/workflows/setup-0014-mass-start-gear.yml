name: One-shot C-330 mass-aware start gear 0.0.1.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0014-mass-start-gear.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply 0.0.1.4 mass-aware start gear
        run: python3 .github/scripts/setup_0014_mass_start_gear.py
      - name: Commit 0.0.1.4 prerelease
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Scripts/C330TransmissionFix.lua modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Add mass-aware I/3 start for 0.0.1.4'
          git push
