name: One-shot C-330 0.0.3.4 spring control

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0034-spring-control.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply 0.0.3.4 spring control state
        run: python3 .github/scripts/setup_0034_spring_control.py
      - name: Validate XML and control spring values
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('c330m.xml')
          ET.parse('modDesc.xml')
          s=open('c330m.xml', encoding='utf-8').read()
          assert 'spring="12"' not in s
          assert 'spring="15"' in s
          assert '<version>0.0.3.4</version>' in open('modDesc.xml', encoding='utf-8').read()
          print('0.0.3.4 XML validation OK')
          PY
      - name: Commit 0.0.3.4 prerelease state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A c330m.xml debug/TyreDebugKit.lua modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Add standardized spring=15 control 0.0.3.4'
          git push
