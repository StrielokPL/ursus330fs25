name: One-shot C-330 gearbox setup 0.0.0.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0004.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply 0.0.0.4 gearbox setup
        run: python3 .github/scripts/setup_0004.py

      - name: Commit gearbox test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add c330m.xml modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Configure C-330 factory gearbox test 0.0.0.4'
          git push
