name: One-shot C-330 0.0.3.0 mass stable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0030-mass-stable.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Promote validated mass state to 0.0.3.0 stable
        run: python3 .github/scripts/setup_0030_mass_stable.py
      - name: Commit 0.0.3.0 stable state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md debug/TractorDebugKit.lua
          git commit -m 'Release stable C-330 mass balance 0.0.3.0'
          git push
