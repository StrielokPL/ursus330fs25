name: One-shot C-330 shift failsafe 0.0.1.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0018-shift-failsafe.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply 0.0.1.8 shift failsafe and reverse start
        run: python3 .github/scripts/setup_0018_shift_failsafe_reverse.py
      - name: Commit 0.0.1.8 prerelease
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Scripts/C330TransmissionFix.lua modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Add 2s upshift failsafe and R-II start for 0.0.1.8'
          git push
