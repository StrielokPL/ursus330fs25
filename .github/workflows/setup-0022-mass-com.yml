name: One-shot C-330 0.0.2.2 mass COM test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0022-mass-com.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply 0.0.2.2 base mass / COM correction
        run: python3 .github/scripts/setup_0022_mass_com.py
      - name: Commit 0.0.2.2 prerelease state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A c330m.xml modDesc.xml debug/TractorDebugKit.lua README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Test C-330 base mass and COM correction 0.0.2.2'
          git push
