name: One-shot C-330 range-source diagnostics 0.0.0.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0006.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply 0.0.0.6 diagnostics
        run: python3 .github/scripts/setup_0006.py

      - name: Commit diagnostic prerelease
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Scripts/C330TransmissionFix.lua debug/TractorDebugKit.lua modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Add range-source diagnostics for C-330 0.0.0.6'
          git push
