name: One-shot C-330 top-gear stability 0.0.1.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0017-topgear-stability.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply 0.0.1.7 heavy-set II/3 stability guard
        run: python3 .github/scripts/setup_0017_topgear_stability.py
      - name: Commit 0.0.1.7 prerelease
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Scripts/C330TransmissionFix.lua modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Add heavy-set II/3 stability guard for 0.0.1.7'
          git push
