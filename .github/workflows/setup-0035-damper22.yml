name: One-shot C-330 0.0.3.5 damper test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0035-damper22.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply 0.0.3.5 damper test state
        run: python3 .github/scripts/setup_0035_damper22.py
      - name: Validate XML and tyre values
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('c330m.xml')
          ET.parse('modDesc.xml')
          s=open('c330m.xml', encoding='utf-8').read()
          assert s.count('spring="12"') == 40
          assert s.count('damper="22"') == 40
          assert 'spring="15"' not in s
          assert 'damper="25"' not in s
          assert '<version>0.0.3.5</version>' in open('modDesc.xml', encoding='utf-8').read()
          print('0.0.3.5 XML validation OK')
          PY
      - name: Commit 0.0.3.5 prerelease state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A c330m.xml debug/TyreDebugKit.lua modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Add spring=12 damper=22 tyre test 0.0.3.5'
          git push
