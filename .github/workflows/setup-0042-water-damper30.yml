name: One-shot C-330 0.0.4.2 water damper=30 test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0042-water-damper30.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply 0.0.4.2 water damper test
        run: python3 .github/scripts/setup_0042_water_damper30.py
      - name: Validate isolated change
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import json
          ET.parse('c330m.xml')
          ET.parse('modDesc.xml')
          s=open('c330m.xml', encoding='utf-8').read()
          assert s.count('spring="12"') == 40
          assert s.count('damper="22"') == 40
          assert s.count('<design24Configuration name=') == 2
          md=open('modDesc.xml', encoding='utf-8').read()
          assert '<version>0.0.4.2</version>' in md
          assert 'Scripts/C330LiquidBallast.lua' in md
          assert 'debug/TyreDebugKit.lua' in md
          lua=open('Scripts/C330LiquidBallast.lua', encoding='utf-8').read()
          assert 'waterMassPerWheel = 0.132' in lua
          assert 'springRatio = 14 / 12' in lua
          assert 'damperRatio = 30 / 22' in lua
          assert 'targetApprox=14/30' in lua
          dbg=open('debug/TyreDebugKit.lua', encoding='utf-8').read()
          assert 'TyreDebugKit 0.0.4.2 installed' in dbg
          r=json.load(open('.release/release.json', encoding='utf-8'))
          assert r['version']=='0.0.4.2' and r['prerelease'] is True
          print('0.0.4.2 isolated water-damper validation OK')
          PY
      - name: Commit 0.0.4.2 prerelease state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Scripts/C330LiquidBallast.lua debug/TyreDebugKit.lua modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Tune water-ballast damping to 30 for 0.0.4.2'
          git push
