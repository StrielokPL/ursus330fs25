name: One-shot C-330 0.0.3.3 tyre spring test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0033-spring-test.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply 0.0.3.3 tyre spring test state
        run: python3 .github/scripts/setup_0033_spring_test.py
      - name: Validate XML and changed spring values
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('c330m.xml')
          ET.parse('modDesc.xml')
          s=open('c330m.xml', encoding='utf-8').read()
          assert 'spring="15"' not in s
          assert 'spring="12"' in s
          assert '<version>0.0.3.3</version>' in open('modDesc.xml', encoding='utf-8').read()
          print('0.0.3.3 XML validation OK')
          PY
      - name: Commit 0.0.3.3 prerelease state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A c330m.xml debug/TyreDebugKit.lua modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Test softer C-330 tyre spring 0.0.3.3'
          git push
