name: One-shot C-330 0.0.3.1 tyre diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0031-tyre-diagnostics.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply 0.0.3.1 tyre diagnostic prerelease state
        run: python3 .github/scripts/setup_0031_tyre_diagnostics.py
      - name: Commit 0.0.3.1 prerelease state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A debug/TyreDebugKit.lua modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Test C-330 tyre pressure diagnostics 0.0.3.1'
          git push
