name: One-shot C-330 full 6F2R gearbox 0.0.0.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0007.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply 0.0.0.7 gearbox completion
        run: python3 .github/scripts/setup_0007.py

      - name: Commit gearbox prerelease
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Scripts/C330TransmissionFix.lua debug/TractorDebugKit.lua modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Complete C-330 automatic 6F2R gearbox for 0.0.0.7'
          git push
