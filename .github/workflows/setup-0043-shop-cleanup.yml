name: One-shot C-330 0.0.4.3 shop cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0043-shop-cleanup.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply 0.0.4.3 shop cleanup
        run: python3 .github/scripts/setup_0043_shop_cleanup.py
      - name: Validate shop cleanup and unchanged physics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json, xml.etree.ElementTree as ET
          ET.parse('c330m.xml')
          ET.parse('modDesc.xml')
          s=Path('c330m.xml').read_text(encoding='utf-8')
          assert s.count('spring="12"') == 40
          assert s.count('damper="22"') == 40
          assert 'massActive="342"' in s and 'massActive="300"' in s
          assert '<design24Configuration name="$l10n_ui_yes" price="0">' in s
          expected={
            'LIZARD_DEFAULT':'0','LIZARD_WIDE':'100','LIZARD_WEIGHTS':'300','LIZARD_WIDEWEIGHT':'400','LIZARD_WIDEWEIGHTS':'300',
            'LIZARD2_DEFAULT':'0','LIZARD2_WIDE':'100','LIZARD2_WEIGHTS':'300','LIZARD2_WIDEWEIGHT':'400','LIZARD2_WIDEWEIGHTS':'300'}
          for save_id, price in expected.items():
              m=re.search(r'<wheelConfiguration\b[^>]*price="([0-9.]+)"[^>]*saveId="'+re.escape(save_id)+r'"', s)
              assert m and m.group(1)==price, (save_id, m.group(1) if m else None)
          fs=s[s.index('<frontloaderConfigurations>'):s.index('</frontloaderConfigurations>')]
          assert fs.count('price="600"') == 2
          vt=s[s.index('<vehicleTypeConfigurations>'):s.index('</vehicleTypeConfigurations>')]
          assert len(re.findall(r'<vehicleTypeConfiguration\s+name="[1-9]"\s+price="500"', vt)) == 9
          md=Path('modDesc.xml').read_text(encoding='utf-8')
          assert '<version>0.0.4.3</version>' in md
          assert 'Scripts/C330ShopOrder.lua' in md
          assert 'debug/TyreDebugKit.lua' not in md
          assert not Path('debug/TyreDebugKit.lua').exists()
          water=Path('Scripts/C330LiquidBallast.lua').read_text(encoding='utf-8')
          assert 'waterMassPerWheel = 0.132' in water
          assert 'springRatio = 14 / 12' in water
          assert 'damperRatio = 30 / 22' in water
          shop=Path('Scripts/C330ShopOrder.lua').read_text(encoding='utf-8')
          for token in ['"motor"','"wheel"','"design24"','"design3"','"vehicleType"','"frontloader"']:
              assert token in shop
          r=json.loads(Path('.release/release.json').read_text(encoding='utf-8'))
          assert r['version']=='0.0.4.3' and r['prerelease'] is True
          print('0.0.4.3 shop cleanup validation OK')
          PY
      - name: Commit 0.0.4.3 prerelease state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+StrielokPL@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare 0.0.4.3 shop cleanup test'
          git push
