name: Audit C-330 shop configurations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-shop-configs.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit configuration sections and prices
        run: python3 .github/scripts/audit_shop_configs.py
