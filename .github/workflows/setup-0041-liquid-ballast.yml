name: One-shot C-330 0.0.4.1 liquid ballast prototype

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0041-liquid-ballast.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply 0.0.4.1 liquid ballast prototype
        run: python3 .github/scripts/setup_0041_liquid_ballast.py
      - name: Validate XML, configuration and runtime layer
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import json
          ET.parse('c330m.xml')
          ET.parse('modDesc.xml')
          s=open('c330m.xml', encoding='utf-8').read()
          assert s.count('spring="12"') == 40
          assert s.count('damper="22"') == 40
          assert s.count('<design24Configurations') == 1
          assert s.count('<design24Configuration name=') == 2
          md=open('modDesc.xml', encoding='utf-8').read()
          assert '<version>0.0.4.1</version>' in md
          assert 'Scripts/C330LiquidBallast.lua' in md
          assert 'debug/TyreDebugKit.lua' in md
          lua=open('Scripts/C330LiquidBallast.lua', encoding='utf-8').read()
          assert 'waterMassPerWheel = 0.132' in lua
          assert 'springRatio = 14 / 12' in lua
          assert 'damperRatio = 26 / 22' in lua
          r=json.load(open('.release/release.json', encoding='utf-8'))
          assert r['version']=='0.0.4.1' and r['prerelease'] is True
          print('0.0.4.1 liquid ballast validation OK')
          PY
      - name: Commit 0.0.4.1 prerelease state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A c330m.xml modDesc.xml Scripts/C330LiquidBallast.lua debug/TyreDebugKit.lua README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Add rear tyre liquid ballast prototype 0.0.4.1'
          git push
