name: One-shot C-330 reverse nil guard 0.0.0.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-0007-reverse-nil.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply reverse nil guard fix
        run: python3 .github/scripts/fix_0007_reverse_nil.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Scripts/C330TransmissionFix.lua
          git commit -m 'Harden C-330 reverse range prediction for 0.0.0.7'
          git push
