name: One-shot C-330 0.0.2.0 stable release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0020-stable.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply 0.0.2.0 stable release cleanup
        run: python3 .github/scripts/setup_0020_stable.py
      - name: Commit 0.0.2.0 stable release state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A Scripts/C330TransmissionFix.lua modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md debug/TractorDebugKit.lua
          git commit -m 'Release stable C-330 drivetrain milestone 0.0.2.0'
          git push
