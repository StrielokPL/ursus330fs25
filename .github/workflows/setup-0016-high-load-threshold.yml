name: One-shot C-330 high-load threshold 0.0.1.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0016-high-load-threshold.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply 0.0.1.6 high-load threshold refinement
        run: python3 .github/scripts/setup_0016_high_load_threshold.py
      - name: Commit 0.0.1.6 prerelease
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Scripts/C330TransmissionFix.lua modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Refine high-load top gear threshold for 0.0.1.6'
          git push
