name: One-shot C-330 ADS-safe gearbox setup 0.0.0.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0005.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply 0.0.0.5 gearbox hardening
        run: python3 .github/scripts/setup_0005.py

      - name: Commit ADS-safe gearbox test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Scripts/C330TransmissionFix.lua modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Harden C-330 gearbox controller for ADS in 0.0.0.5'
          git push
