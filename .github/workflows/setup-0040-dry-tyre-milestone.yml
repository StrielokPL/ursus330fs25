name: One-shot C-330 0.0.4.0 dry tyre milestone

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0040-dry-tyre-milestone.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply 0.0.4.0 stable dry tyre milestone
        run: python3 .github/scripts/setup_0040_dry_tyre_milestone.py
      - name: Validate XML and milestone state
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('c330m.xml')
          ET.parse('modDesc.xml')
          s=open('c330m.xml', encoding='utf-8').read()
          assert s.count('spring="12"') == 40
          assert s.count('damper="22"') == 40
          md=open('modDesc.xml', encoding='utf-8').read()
          assert '<version>0.0.4.0</version>' in md
          assert 'debug/TyreDebugKit.lua' not in md
          assert 'Scripts/C330TransmissionFix.lua' in md
          import json
          r=json.load(open('.release/release.json', encoding='utf-8'))
          assert r['version']=='0.0.4.0' and r['prerelease'] is False
          print('0.0.4.0 milestone validation OK')
          PY
      - name: Commit 0.0.4.0 stable state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A c330m.xml modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Promote dry tyre physics milestone 0.0.4.0'
          git push
