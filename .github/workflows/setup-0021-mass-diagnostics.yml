name: One-shot C-330 0.0.2.1 mass diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0021-mass-diagnostics.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 0.0.2.1 mass diagnostic setup
        run: python3 .github/scripts/setup_0021_mass_diagnostics.py
      - name: Commit 0.0.2.1 prerelease state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/TractorDebugKit.lua modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Add C-330 mass diagnostics for 0.0.2.1'
          git push
