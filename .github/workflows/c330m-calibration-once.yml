name: One-shot C-330M calibration

on:
  push:
    paths:
      - '.github/workflows/c330m-calibration-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply inherited C-330M calibration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          xml = 'c330m.xml'

          replace_once(
              xml,
              '<motorConfiguration name="C-330M" hp="31" price="0">',
              '<motorConfiguration name="C-330M" hp="30" price="0">'
          )
          replace_once(
              xml,
              '<motor torqueScale="0.138" minRpm="600" maxRpm="2200" accelerationLimit="1.0" maxForwardSpeed="27" maxBackwardSpeed="8" brakeForce="1.3" lowBrakeForceScale="0.1" dampingRateScale="0.1">',
              '<motor torqueScale="0.100" minRpm="600" maxRpm="2200" accelerationLimit="1.0" maxForwardSpeed="26.290" maxBackwardSpeed="7.133" brakeForce="1.3" lowBrakeForceScale="0.1" dampingRateScale="0.1">'
          )
          replace_once(
              xml,
              '''                    <torque normRpm="0.45" torque="0.9"/>\n                    <torque normRpm="0.50" torque="0.97"/>\n                    <torque normRpm="0.59" torque="1"/>\n                    <torque normRpm="0.72" torque="1"/>\n                    <torque normRpm="0.86" torque="0.88"/>\n                    <torque normRpm="1.00" torque="0.72"/>''',
              '''                    <!-- C-330M keeps the same S-312C engine curve as the calibrated C-330. -->\n                    <torque normRpm="0.45" torque="0.88"/>      <!-- 990 rpm: 88 Nm -->\n                    <torque normRpm="0.50" torque="0.92"/>      <!-- 1100 rpm: 92 Nm -->\n                    <torque normRpm="0.59" torque="0.96"/>      <!-- 1298 rpm: 96 Nm -->\n                    <torque normRpm="0.727273" torque="1.00"/>  <!-- 1600 rpm: 100 Nm -->\n                    <torque normRpm="0.818182" torque="1.00"/>  <!-- 1800 rpm: 100 Nm -->\n                    <torque normRpm="1.00" torque="0.972364"/>  <!-- 2200 rpm: 97.24 Nm ~= 22.4 kW -->'''
          )
          replace_once(xml, '<group ratio="0.36" name="I"/>', '<group ratio="0.24691358" name="I"/>')
          replace_once(xml, '<forwardGear maxSpeed="13.2"/>', '<forwardGear maxSpeed="8.491"/>')
          replace_once(xml, '<forwardGear maxSpeed="17.2"/>', '<forwardGear maxSpeed="16.460"/>')
          replace_once(xml, '<forwardGear maxSpeed="27.0"/>', '<forwardGear maxSpeed="26.290"/>')
          replace_once(xml, '<backwardGear maxSpeed="8.4"/>', '<backwardGear maxSpeed="7.133"/>')

          lua = 'Scripts/C330TransmissionFix.lua'
          replace_once(
              lua,
              '-- Ursus C-330 FS25 automatic range controller',
              '-- Ursus C-330/C-330M FS25 automatic range controller'
          )
          replace_once(
              lua,
              '-- explicit C-330 range logic. C-330M remains intentionally excluded.',
              '-- explicit C-330-family range logic. C-330M inherits the validated controller.'
          )
          replace_once(
              lua,
              'motor.c330FixTargetCache = getSelectedMotorConfigurationName(motor.vehicle) == "C-330"',
              '''local motorName = getSelectedMotorConfigurationName(motor.vehicle)\n            motor.c330FixTargetCache = motorName == "C-330" or motorName == "C-330M"'''
          )

          moddesc = 'modDesc.xml'
          replace_once(moddesc, '<version>0.0.4.3</version>', '<version>0.0.5.0</version>')
          replace_once(moddesc, 'Power: 31,5 hp', 'Power: 30 hp')
          replace_once(moddesc, 'Top Speed: 27 kph', 'Top Speed: up to 26.3 kph')
          replace_once(moddesc, 'Leistung: 31,5 PS', 'Leistung: 30 PS')
          replace_once(moddesc, 'Höchstgeschwindigkeit: 27 km/h', 'Höchstgeschwindigkeit: bis 26,3 km/h')
          replace_once(moddesc, 'Pouvoir: 31,5 cv', 'Pouvoir: 30 cv')
          replace_once(moddesc, 'Vitesse de pointe: 27 km/h', 'Vitesse de pointe: jusqu’à 26,3 km/h')
          replace_once(
              moddesc,
              '<!-- Stable drivetrain + final liquid ballast + local C-330 shop ordering. -->',
              '<!-- C-330 stable drivetrain + inherited C-330M calibration test + shared shop ordering. -->'
          )

          validation = Path('docs/VALIDATION_STATUS.md')
          text = validation.read_text(encoding='utf-8')
          marker = '# Current validation status'
          if marker in text and '## C-330M 0.0.5.0 calibration status' not in text:
              text += '''\n\n## C-330M 0.0.5.0 calibration status\n\n**DEVELOPMENT / NOT YET VALIDATED.**\n\nThe C-330M now inherits the validated C-330 S-312C engine curve, base physics, tyre/liquid-ballast setup, shop order, and automatic 6F/2R controller. Its distinct calibration is limited to the faster final-drive speed set: II/1 8.491, II/2 16.460, II/3 26.290 km/h and R-II 7.133 km/h, with the same 0.24691358 low-range ratio. C-330 values remain unchanged.\n'''
              validation.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/c330m-calibration-once.yml

      - name: Commit calibration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Calibrate C-330M from validated C-330 baseline"
          git push
