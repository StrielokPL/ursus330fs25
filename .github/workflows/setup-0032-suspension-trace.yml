name: One-shot C-330 0.0.3.2 suspension diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0032-suspension-trace.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply 0.0.3.2 suspension diagnostic prerelease state
        run: python3 .github/scripts/setup_0032_suspension_trace.py
      - name: Commit 0.0.3.2 prerelease state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A debug/TyreDebugKit.lua modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Improve C-330 suspension diagnostics 0.0.3.2'
          git push
