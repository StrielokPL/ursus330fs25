name: One-shot S-312C torque test 0.0.1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0011-engine.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply 0.0.1.1 engine test
        run: python3 .github/scripts/setup_0011_engine.py
      - name: Commit engine test prerelease
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add c330m.xml debug/TractorDebugKit.lua modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Add S-312C torque curve test for 0.0.1.1'
          git push
