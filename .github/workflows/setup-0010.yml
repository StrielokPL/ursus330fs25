name: One-shot C-330 gearbox milestone 0.0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0010.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply 0.0.1.0 milestone metadata
        run: python3 .github/scripts/setup_0010.py
      - name: Commit milestone release metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Close C-330 gearbox phase in 0.0.1.0'
          git push
