name: One-shot C-330 0.0.2.3 factory ballast test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0023-factory-ballast.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply 0.0.2.3 factory ballast masses
        run: python3 .github/scripts/setup_0023_factory_ballast.py
      - name: Commit 0.0.2.3 prerelease state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A c330m.xml Wheels/LizardBack.xml modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Test C-330 factory ballast masses 0.0.2.3'
          git push
