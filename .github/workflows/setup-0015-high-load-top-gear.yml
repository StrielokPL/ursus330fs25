name: One-shot C-330 high-load top gear 0.0.1.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-0015-high-load-top-gear.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply 0.0.1.5 high-load top gear guard
        run: python3 .github/scripts/setup_0015_high_load_top_gear.py
      - name: Commit 0.0.1.5 prerelease
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Scripts/C330TransmissionFix.lua modDesc.xml README.md CHANGELOG.md .release/release.json .release/notes.md
          git commit -m 'Add high-load top gear guard for 0.0.1.5'
          git push
